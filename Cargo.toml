[package]
name = "mcp-studio"
version = "0.6.0-alpha"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Local-first web control plane for MCP servers and secure tunnels"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
nix = { version = "0.30", features = ["fs", "signal", "process", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rmcp = { version = "3.4", features = ["client", "transport-child-process"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled", "hooks", "limits"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "io-util", "fs", "time", "sync"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
