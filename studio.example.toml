log_capacity = 500
stop_timeout_ms = 3000

[server]
listen_addr = "127.0.0.1:18100"

# Milestone 4 persistent registry. The path is owned by Studio and is written
# atomically. mcp_root is the only discovery/registration root.
[registry]
path = "data/registry.toml"
mcp_root = ".."

[tunnel]
name = "Secure tunnel"
runtime = "../tunnel-client/tunnel-client-runtime-cloudflared"
working_dir = "../tunnel-client"
config_file = "../tunnel-client/config.yaml"

# Trusted runtime-distribution roots. Versions are read from deployed runtime
# artifacts, never inferred from source manifests/Git HEAD. Desired versions are
# optional manual pins; without a pin M5 preserves the currently installed version.
[updates]
source_root = ".."
bin_root = "../bin"
runtime_root = "../runtime"

# [updates.desired]
# git = "0.1.0"
# tunnel = "0.0.14"

# M8 automation foundation. Missing [automation] is equivalent to these safe
# manual/disabled policies. M8.1 persists scheduler/circuit state only and
# performs no automatic release check, staging, activation, restart, or
# reconciliation mutation. Fleet-managed policy rendering is introduced by M8.5.
[automation]
startup_grace_seconds = 30
health_interval_seconds = 15
cleanup_interval_seconds = 3600

[automation.updates]
policy = "manual"
check_on_startup = false
check_interval_seconds = 21600
max_consecutive_failures = 5
circuit_cooldown_seconds = 21600
prepared_ttl_seconds = 21600
max_staging_bytes = 1073741824

[automation.reconciliation]
policy = "manual"
check_on_startup = true
check_interval_seconds = 300
max_consecutive_failures = 5
circuit_cooldown_seconds = 21600

[automation.restart]
mcp = "disabled"
tunnel = "disabled"
max_attempts = 3
stability_window_seconds = 30
initial_backoff_seconds = 1
max_backoff_seconds = 30
circuit_cooldown_seconds = 60

[automation.maintenance]
weekdays_utc = ["sat", "sun"]
start_utc = "02:00"
duration_minutes = 120

# Optional server-side secret references. Values are resolved only by Studio
# and are never returned through the API/WebSocket/dashboard.
# [tunnel.env]
# TUNNEL_TOKEN = { from_env = "MCP_TUNNEL_TOKEN" }
# CLOUDFLARED_CREDENTIAL = { from_file = "../secrets/cloudflared-token" }

# Legacy static MCP entries are used only to bootstrap data/registry.toml when
# no persistent registry exists. Once registry.toml exists, it is authoritative.
[mcp.blender]
name = "Blender"
command = "../blender/target/debug/rust-mcp-blender"
working_dir = "../blender"
args = []

[mcp.filesystem]
name = "Filesystem"
command = "../filesystem/target/debug/rust-mcp-filesystem"
working_dir = "../filesystem"
args = ["--root", ".."]

[mcp.git]
name = "Git"
command = "../git/target/debug/rust-mcp-git"
working_dir = "../git"
args = ["--root", "../.."]